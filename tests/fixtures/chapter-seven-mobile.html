<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chương 7 · 360px</title>
    <style>
      body {
        margin: 0;
        background: #554c40;
      }
      iframe {
        display: block;
        width: 360px;
        height: 900px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe title="Chương 7 ở 360px" src="about:blank"></iframe>
    <pre id="ch7-browser-result">RUNNING</pre>
    <script>
      document.querySelector("iframe").src =
        "/tests/fixtures/chapter-seven-browser.html" +
        (location.search || "?route=goal");
      window.addEventListener("message", (event) => {
        if (
          event.origin === location.origin &&
          event.data.type === "ch7-review"
        )
          document.getElementById("ch7-browser-result").textContent =
            event.data.result;
      });
    </script>
  </body>
</html>
